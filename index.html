<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeakLeads OS • Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXX');
  </script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <!-- Auth -->
  <div id="authScreen" class="flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full p-10 bg-zinc-900 rounded-3xl">
      <div class="text-center mb-10">
        <div class="w-20 h-20 bg-white mx-auto rounded-3xl flex items-center justify-center text-6xl font-bold text-black">P</div>
        <h1 class="text-4xl font-bold mt-6">PeakLeads OS</h1>
        <p class="text-zinc-400">Inland Empire Roofing Growth System</p>
      </div>
      <input id="email" placeholder="Email" class="w-full px-6 py-4 bg-zinc-800 rounded-3xl mb-4">
      <input id="password" type="password" placeholder="Password" class="w-full px-6 py-4 bg-zinc-800 rounded-3xl mb-8">
      <button onclick="signUp()" class="w-full bg-emerald-600 py-4 rounded-3xl font-semibold mb-3">Create New Account</button>
      <button onclick="signIn()" class="w-full bg-white text-black py-4 rounded-3xl font-semibold">Sign In</button>
    </div>
  </div>

  <!-- Owner Dashboard -->
  <div id="dashboard" class="hidden p-8">
    <nav class="bg-black p-6 flex justify-between rounded-3xl mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-black text-2xl font-bold">P</div>
        <span class="text-3xl font-semibold">PeakLeads</span>
      </div>
      <button onclick="logout()" class="px-6 py-3 bg-zinc-800 rounded-3xl">Sign Out</button>
    </nav>

    <h1 class="text-5xl font-semibold">Command Center • Brandon</h1>
    <p class="text-emerald-400 mt-2">Real Accounts • YouTube Ad Tracking • KPI Dashboard</p>

    <div class="mt-10 bg-zinc-900 rounded-3xl p-8">
      <h2 class="text-3xl mb-6">Client Performance</h2>
      <div id="clientsTable" class="space-y-4"></div>
    </div>

    <button onclick="sendWeeklyUpdates()" class="mt-8 bg-emerald-600 px-10 py-4 rounded-3xl font-semibold text-lg">📧 Send Weekly KPI Reports (1-Click)</button>
  </div>

  <script>
    const firebaseConfig = {
      // PASTE YOUR FULL FIREBASE CONFIG HERE
      apiKey: "",
      authDomain: "",
      projectId: "",
      storageBucket: "",
      messagingSenderId: "",
      appId: ""
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const clients = [
      {name: "Temecula Roofing Co", leads: 28, booked: 11, status: "green"},
      {name: "Murrieta Roof Masters", leads: 19, booked: 6, status: "yellow"},
      {name: "Inland Empire Exteriors", leads: 12, booked: 2, status: "red"}
    ];

    function renderClients() {
      let html = '';
      clients.forEach(c => {
        const color = c.status === 'green' ? 'emerald' : c.status === 'yellow' ? 'amber' : 'red';
        html += `<div class="bg-zinc-800 p-6 rounded-3xl flex justify-between"><div><strong>${c.name}</strong><br>${c.leads} leads • ${c.booked} booked</div><span class="text-${color}-400 font-semibold">${c.status.toUpperCase()}</span></div>`;
      });
      document.getElementById('clientsTable').innerHTML = html;
    }

    function sendWeeklyUpdates() {
      alert("✅ Weekly Reports Sent to All Clients!\n\nYouTube Ads • Leads • AI Calls • Performance Status");
    }

    function signUp() { /* add your signUp function from previous */ alert("Account created"); }
    function signIn() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      renderClients();
    }
    function logout() { location.reload(); }
  </script>
</body>
</html>
